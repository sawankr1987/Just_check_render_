<!DOCTYPE html>
<html>
<head>
  <title>Diabetes Predictor</title>
</head>
<body>

<h2>Diabetes Prediction Form</h2>

<form id="predictionForm">
  <input type="number" id="Pregnancies" placeholder="Pregnancies" required><br>
  <input type="number" id="Glucose" placeholder="Glucose" required><br>
  <input type="number" id="BloodPressure" placeholder="Blood Pressure" required><br>
  <input type="number" id="SkinThickness" placeholder="Skin Thickness" required><br>
  <input type="number" id="Insulin" placeholder="Insulin" required><br>
  <input type="number" id="BMI" step="0.1" placeholder="BMI" required><br>
  <input type="number" id="DiabetesPedigreeFunction" step="0.01" placeholder="DPF" required><br>
  <input type="number" id="Age" placeholder="Age" required><br>

  <button type="submit">Predict</button>
</form>

<h3 id="result"></h3>

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("predictionForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
      Pregnancies: document.getElementById("Pregnancies").value,
      Glucose: document.getElementById("Glucose").value,
      BloodPressure: document.getElementById("BloodPressure").value,
      SkinThickness: document.getElementById("SkinThickness").value,
      Insulin: document.getElementById("Insulin").value,
      BMI: document.getElementById("BMI").value,
      DiabetesPedigreeFunction: document.getElementById("DiabetesPedigreeFunction").value,
      Age: document.getElementById("Age").value
    };

    const res = await fetch("/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });

    const result = await res.json();
    document.getElementById("result").innerText =
      result.prediction ? result.prediction : result.error;
  });
});
</script>

</body>
</html>
